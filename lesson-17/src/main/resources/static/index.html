<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>南坡小炒·点餐</title>
    <style>
        body { font-family: "PingFang SC", sans-serif; max-width: 420px; margin: 40px auto; background: #faf7f2; padding: 0 16px; }
        h1 { text-align: center; }
        .dish { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px dashed #ddd; }
        .dish img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; vertical-align: middle; margin-right: 6px; }
        .placeholder { display: inline-block; width: 48px; height: 48px; line-height: 48px; text-align: center; background: #eee; border-radius: 6px; margin-right: 6px; }
        .price { color: #c0392b; font-weight: bold; }
        button { width: 100%; padding: 12px; margin-top: 16px; font-size: 16px; background: #c0392b; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
        input[type=number] { width: 56px; }
        .auth { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
        .auth input { flex: 1; min-width: 80px; padding: 6px; }
        .auth-btn { width: auto; margin-top: 0; padding: 6px 12px; font-size: 14px; background: #555; }
        .ai { margin-top: 20px; padding: 12px; background: #fff; border: 1px solid #e8e8e8; border-radius: 8px; }
        .ai h3 { margin: 0 0 8px; font-size: 15px; }
        .ai input { flex: 1; min-width: 200px; padding: 6px; }
        .ai > div:first-of-type { display: flex; gap: 6px; }
        .ai-btn { width: auto; margin-top: 0; padding: 6px 12px; font-size: 14px; background: #2980b9; }
        .ai-reply { margin-top: 8px; padding: 10px; background: #f4f9ff; border-radius: 6px; font-size: 14px; min-height: 20px; white-space: pre-wrap; }
        pre { background: #333; color: #9f9; padding: 12px; border-radius: 6px; min-height: 48px; font-size: 12px; }
    </style>
</head>
<body>
<h1>🍜 南坡小炒</h1>

<!-- 会员区（第16课）：先登录，下单才带得上令牌 -->
<div class="auth">
    <input id="username" placeholder="会员名">
    <input id="password" type="password" placeholder="密码">
    <button class="auth-btn" onclick="register()">办卡</button>
    <button class="auth-btn" onclick="login()">登录</button>
    <span id="who" style="color:#27ae60"></span>
</div>

<!-- 菜单区：页面打开后由 fetch(/menu) 填充 -->
<div id="menu">菜单加载中…</div>

<button onclick="order()">下单</button>
<button onclick="loadOrders()" style="background:#555; margin-top:8px;">📖 翻账本（最近订单）</button>

<!-- 小票区：展示 POST /order 的返回结果 -->
<pre id="result">小票将显示在这里</pre>

<!-- 账本区：展示 GET /order/list 的返回结果 -->
<pre id="orders"></pre>

<!-- AI 区（第17课）：AI 服务员小智 -->
<div class="ai">
    <h3>🤖 AI 服务员·小智</h3>
    <div>
        <input id="aiInput" placeholder="问小智：有什么不辣的菜？">
        <button class="ai-btn" onclick="askAi()">问小智</button>
    </div>
    <div id="aiReply" class="ai-reply">小智待命中…（未配置 NANPO_AI_KEY 时会说"AI 服务暂时不可用"）</div>
</div>

<script>
    // ===== 会员（第16课）：令牌管理与登录 =====
    // 所有需要亮卡的请求都带上 Authorization: Bearer <accessToken>
    function authHeaders() {
        const headers = { 'Content-Type': 'application/json' };
        const token = localStorage.getItem('accessToken');
        if (token) headers['Authorization'] = 'Bearer ' + token;
        return headers;
    }

    function register() {
        fetch('/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.value, password: password.value })
        })
        .then(r => r.json())
        .then(result => alert(result.code === 200 ? '办卡成功，请登录' : result.msg));
    }

    function login() {
        fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: username.value, password: password.value })
        })
        .then(r => r.json())
        .then(result => {
            if (result.code === 200) {
                // 两张卡分开收好：短卡随请求带，长卡只在续卡时用
                localStorage.setItem('accessToken', result.data.accessToken);
                localStorage.setItem('refreshToken', result.data.refreshToken);
                who.textContent = '会员：' + result.data.nickname;
            } else {
                alert(result.msg);
            }
        });
    }

    // ===== 菜单 =====
    // 第14课适配（第四次前后端联动）：/menu 从 Map{菜名:价格} 升级为 List<MenuVO>
    // ——加了 imageUrl 后 Map 装不下了；有照片显示照片，没照片显示占位图标
    fetch('/menu')
        .then(resp => resp.json())
        .then(result => {
            let html = '';
            result.data.forEach(dish => {
                const img = dish.imageUrl
                    ? `<img src="${dish.imageUrl}" alt="${dish.dishName}">`
                    : `<span class="placeholder">🍽️</span>`;
                html += `
                <div class="dish">
                    <span>${img} ${dish.dishName} <span class="price">￥${dish.price}</span></span>
                    <span>数量 <input type="number" min="0" value="0" data-dish="${dish.dishName}"></span>
                </div>`;
            });
            document.getElementById('menu').innerHTML = html;
        });

    // 点击下单：收集数量大于0的菜，POST /order 提交 JSON
    function order() {
        const dishList = [];
        document.querySelectorAll('input[data-dish]').forEach(input => {
            if (input.value > 0) {
                dishList.push({ dishName: input.dataset.dish, count: Number(input.value) });
            }
        });
        if (dishList.length === 0) {
            alert('还没点菜呢');
            return;
        }
        // 第16课：下单要亮卡——带 Authorization 头；未登录时后端回 40101
        fetch('/order', {
            method: 'POST',
            headers: authHeaders(),
            body: JSON.stringify({ dishList: dishList })
        })
        .then(resp => resp.json())
        .then(result => {
            // 第6课适配：后端统一异常处理后，业务错误也能拿到规范 JSON 了
            // （第5课时点错菜还是 500 HTML 丑页，现在按 code 分流展示）
            if (result.code === 200) {
                document.getElementById('result').innerText = JSON.stringify(result, null, 2);
            } else {
                document.getElementById('result').innerText = '❌ ' + result.msg + '（code=' + result.code + '）';
            }
        })
        .catch(() => {
            // 点了不存在的菜：后端还是直接抛异常(第2课遗留)，返回的是 500 HTML 错误页，
            // JSON 解析失败会走到这里——这个丑陋报错，第6课"统一异常处理"来修复
            document.getElementById('result').innerText = '❌ 服务器开小差了（500）';
        });
    }

    // 第12课：翻账本——分页查最近 5 笔订单（page 从 0 开始；第16课起也要亮卡）
    function loadOrders() {
        fetch('/order/list?page=0&size=5', { headers: authHeaders() })
            .then(resp => resp.json())
            .then(result => {
                document.getElementById('orders').innerText = JSON.stringify(result, null, 2);
            });
    }

    // ===== AI 服务员（第17课）：和小智聊天 =====
    function askAi() {
        const msg = aiInput.value.trim();
        if (!msg) { alert('想问点什么？'); return; }
        aiReply.textContent = '小智思考中…';
        fetch('/ai/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: msg })
        })
        .then(r => r.json())
        .then(result => {
            aiReply.textContent = result.code === 200 ? result.data : '❌ ' + result.msg;
        });
    }
</script>
</body>
</html>
