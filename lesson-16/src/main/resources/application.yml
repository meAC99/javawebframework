spring:
  application:
    name: nanpo-xiaochao

  # 第7课：账本（数据源）四要素
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nanpo    # 内存库：应用一停数据就清零（第19课换 MySQL 容器持久化）
    username: sa
    password:

  # 第7课：H2 网页控制台——注意还需要 pom 里引入 spring-boot-h2console 模块（Boot 4 拆分）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 第7课：JPA——实体怎么变成表
  jpa:
    hibernate:
      ddl-auto: update        # create/create-drop/update/none 四个取值课堂对比
    show-sql: true            # 控制台打印 SQL，第8课起"眼见为实"看 JPA 生成的语句

  # 第14课：上传大小限制——超限在 multipart 解析阶段就被拒绝，
  # MaxUploadSizeExceededException 由第6课的统一异常处理台接住
  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

server:
  port: 8080

# 第11课：课堂演示开关——厨房故障模拟。
# true 时墩子配菜抛异常，演示"订单已落库、厨房着火"时事务的作用；
# 演示方式：启动加 -Ddemo.kitchen-failure=true（系统属性优先级高于本文件）
demo:
  kitchen-failure: false

# 第13课：文件存储目录外部化——面向接口+配置外部化，
# 第19课换 MinIO 时只改配置和实现类，业务代码零改动
nanpo:
  storage:
    dir: ./upload
  # 第15/16课：JWT 密钥与有效期。密钥 ≥32 字节（HS256 要求）；
  # 生产环境用环境变量 NANPO_JWT_SECRET 注入，绝不把真密钥提交进仓库
  jwt:
    secret: ${NANPO_JWT_SECRET:nanpo-dev-secret-change-me-please-0123456789}
    access-ttl-minutes: 15     # 短卡：15 分钟（第15课是单张120分钟，第16课拆成长短双卡）
    refresh-ttl-days: 7        # 长卡：7 天，只用来续卡
